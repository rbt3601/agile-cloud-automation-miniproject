name: CI - Gradle Build and Run

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_run:
    name: Build and Run (Gradle + Groovy)
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Java (required for Gradle & Groovy)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Cache Gradle dependencies (for faster builds)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4️⃣ Grant permission to Gradle wrapper
      - name: Grant execute permission
        run: chmod +x gradlew

      # 5️⃣ Build the project
      - name: Build Project
        run: ./gradlew clean build --no-daemon

      # 6️⃣ Run the application (main Groovy app)
      - name: Run Application
        run: ./gradlew run --no-daemon

      # 7️⃣ Upload reports (optional for debugging)
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: build/reports/
